# Netlify deploy settings: static page at the repo root plus one function
# (netlify/functions/planner.mjs) that stores the shared planner data.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
