<!doctype html>
<html lang="en" style="background:#0d1526">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Department</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1f3a'/><g stroke='white' stroke-width='1.6' stroke-linecap='round'><path d='M16 16L8 9M16 16L24 9M16 16L16 25'/><path d='M8 9L24 9M8 9L16 25M24 9L16 25' stroke-opacity='.35'/></g><circle cx='8' cy='9' r='3.6' fill='%23e8590c'/><circle cx='24' cy='9' r='3.6' fill='%231c7ed6'/><circle cx='16' cy='25' r='3.6' fill='%232f9e44'/><circle cx='16' cy='16' r='4' fill='white'/></svg>">
<link rel="icon" type="image/png" sizes="256x256" href="/assets/icon-256.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1d3a">
<meta name="color-scheme" content="dark">
<style>
  /* Always dark: one navy-tinted palette, matching the #0b1d3a app title bar. */
  :root {
    color-scheme: dark;
    --bg: #0d1526; --surface: #131d33; --surface-2: #1a2640; --border: #2a3856;
    --text: #e6ebf3; --muted: #9ba8bd; --faint: #7a88a0;
    --accent: #4dabf7; --accent-text: #0b1d3a;
    --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b; --idle: #5c6a80;
    --shadow: 0 1px 2px rgba(0,0,0,.25);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .live.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .spacer { flex: 1; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 92px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px;
    padding: 6px 11px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--faint); background: color-mix(in srgb, var(--text) 7%, var(--surface-2)); }
  button:active { background: color-mix(in srgb, var(--text) 11%, var(--surface-2)); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); border-color: color-mix(in srgb, var(--accent) 88%, var(--text)); }
  button.danger { color: var(--bad); }
  button.danger:hover { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 12%, var(--surface-2)); }
  button:disabled, select:disabled, input:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border); background: var(--surface-2); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select, input[type=text], textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; min-width: 0;
  }
  select:hover:not(:disabled), input[type=text]:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: var(--faint); }
  select option { background: var(--surface); color: var(--text); }
  ::placeholder { color: var(--faint); opacity: 1; }

  /* new task */
  .new-task { padding: 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: start; }
  .new-task .fields { display: grid; gap: 8px; }
  .new-task textarea { resize: vertical; min-height: 38px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg label { padding: 6px 12px; cursor: pointer; background: var(--surface-2); color: var(--muted); }
  .seg label:hover { color: var(--text); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--text); font-weight: 600; }
  .seg label:has(input:checked) { background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hint { grid-column: 1 / -1; color: var(--faint); font-size: 12px; margin: -2px 0 0; }
  @media (max-width: 720px) { .new-task { grid-template-columns: 1fr; } }

  /* teams */
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .team { overflow: hidden; display: flex; flex-direction: column; }
  .team-head { padding: 12px 14px 10px; border-top: 4px solid var(--team); }
  .team-name { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .pill.active { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .pill.queued { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .pill.paused { color: var(--muted); }
  .pill.done { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .pill.cancelled { color: var(--muted); text-decoration: line-through; }
  .pill.large { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .team-task { margin-top: 6px; color: var(--muted); min-height: 20px; }
  .team-task strong { color: var(--text); font-weight: 600; }
  .focus { font-size: 12px; color: var(--faint); }
  .progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .progress > i { display: block; height: 100%; background: var(--team, var(--accent)); transition: width .4s ease; }
  .prow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .prow .progress { flex: 1; }
  .prow b { font-size: 12px; font-variant-numeric: tabular-nums; width: 36px; text-align: right; }
  .agents { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--border); flex: 1; }
  .agents li { display: grid; grid-template-columns: 10px 92px 1fr; gap: 8px; align-items: center; padding: 5px 14px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .dot.assigned { background: var(--accent); }
  .dot.working { background: var(--ok); animation: pulse 1.6s infinite; }
  .dot.blocked { background: var(--bad); }
  .dot.done { background: var(--team); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.working { animation: none; } .progress > i { transition: none; } }
  .agent-name { color: var(--muted); font-variant-numeric: tabular-nums; }
  .agent-work { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-work.empty { color: var(--faint); }
  .team-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
  .team-actions select { flex: 1; min-width: 140px; }

  /* tasks */
  .task-groups { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 960px) { .task-groups { grid-template-columns: 1fr; } }
  .tasks { display: grid; gap: 10px; }
  .task { padding: 12px 14px; }
  .task-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .task-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--faint); }
  .task-title { font-weight: 600; flex: 1; min-width: 160px; }
  .task-desc { color: var(--muted); margin: 4px 0 0; white-space: pre-wrap; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--team) 20%, transparent); color: var(--text); border: 1px solid color-mix(in srgb, var(--team) 60%, transparent); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--team); }
  .chip button { border: 0; background: transparent; padding: 0 5px; line-height: 1; font-size: 15px; color: var(--muted); border-radius: 50%; }
  .chip button:hover { color: var(--bad); background: transparent; }
  .chip small { font-weight: 500; color: var(--muted); }
  .none { color: var(--faint); font-size: 12px; }
  .task-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .task-actions select { font-size: 12px; padding: 3px 6px; }
  .empty-state { padding: 22px; text-align: center; color: var(--faint); border: 1px dashed var(--border); border-radius: var(--radius); }
  details.finished summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
  .task.finished .prow { opacity: .6; }
  .task.finished .task-title { color: var(--muted); }

  /* log */
  .log { padding: 4px 0; max-height: 620px; overflow: auto; scrollbar-color: var(--border) transparent; }
  .log-item { padding: 7px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log-item:last-child { border-bottom: 0; }
  .log-item time { display: block; font-size: 11px; color: var(--faint); }
  .log-item .who { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.45);
    padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* Team colors lifted toward white so they read as text on the dark surfaces (>= 5:1 for all three teams). */
  .log-item .who { color: color-mix(in srgb, var(--team, var(--text)) 70%, white); }
  .live.warn { color: var(--warn); }
  .live.warn i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
  /* timers (task + team cards) */
  .dur { font-variant-numeric: tabular-nums; }
  .task-timer { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .task-timer .tt-main .dur { color: var(--text); font-weight: 600; }
  .task-timer.running .tt-main .dur { color: var(--ok); }
  .task-timer .tt-teams { display: inline-flex; flex-wrap: wrap; gap: 0 2px; }
  .task-timer .tt-team { color: color-mix(in srgb, var(--team, var(--text)) 70%, white); font-weight: 600; }
  .task-timer .tt-team .dur { font-weight: 500; }
  .task-timer .tt-sep { color: var(--faint); }
  .task.finished .task-timer .tt-main .dur { color: var(--muted); }
  .team-time { margin-top: 2px; font-size: 12px; color: var(--faint); }
  .team-time .dur { color: var(--muted); font-weight: 600; }
  /* time by team */
  .time-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 720px) { .time-grid { grid-template-columns: 1fr; } }
  .time-card { padding: 12px 14px; border-left: 4px solid var(--team); min-width: 0; }
  .time-card.top { box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--team) 55%, transparent); }
  .time-head { display: flex; align-items: center; gap: 8px; }
  .time-name { font-weight: 650; font-size: 15px; color: color-mix(in srgb, var(--team) 70%, white); }
  .pill.time-top { color: var(--text); border-color: color-mix(in srgb, var(--team) 60%, transparent); background: color-mix(in srgb, var(--team) 22%, transparent); }
  .time-total { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
  .time-total .dur { font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
  .time-total small { color: var(--muted); font-size: 12px; }
  .time-bar { margin-top: 6px; }
  .time-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 0; }
  .time-facts div { min-width: 0; }
  .time-facts dt { font-size: 11px; color: var(--muted); }
  .time-facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .time-now { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 0; }
  .time-now strong { color: var(--text); }
  .time-now .time-task { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .time-now .dur { color: var(--ok); font-weight: 600; }
  /* reviews: violet "In review" tint (text >= 4.5:1 on --surface and --surface-2, pill bg included) */
  :root { --review: #c3b1ff; }
  .pill.review { color: var(--review); border-color: color-mix(in srgb, var(--review) 45%, transparent); background: color-mix(in srgb, var(--review) 13%, transparent); }
  .agents li.reviewer { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 7px; }
  .agents li.reviewer .agent-work { display: flex; align-items: center; gap: 6px; }
  .agents li.reviewer .agent-work > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .tag { flex: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px;
    color: var(--review); background: color-mix(in srgb, var(--review) 13%, transparent); border: 1px solid color-mix(in srgb, var(--review) 40%, transparent); }
  .review-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; }
  .review-row .round { color: var(--muted); font-weight: 600; }
  .verdict { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); }
  .verdict b { color: color-mix(in srgb, var(--team, var(--text)) 70%, white); font-weight: 650; }
  .verdict.approved { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .verdict.changes { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .verdict[title] { cursor: help; }
  .verdict .vnote { font-weight: 500; color: var(--muted); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issues { color: var(--warn); font-weight: 600; }
  .verdict-actions { display: inline-flex; gap: 4px; }
  button.ok { color: var(--ok); }
  button.ok:hover { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 12%, var(--surface-2)); }
  button.review { color: var(--review); }
  button.small.link { padding: 1px 6px; font-size: 11px; color: var(--muted); background: transparent; }
  button.small.link:hover { color: var(--text); }
  button.review:hover { border-color: color-mix(in srgb, var(--review) 55%, transparent); background: color-mix(in srgb, var(--review) 12%, var(--surface-2)); }
  .time-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agent Department</h1>
    <span class="live" id="live"><i></i><span>Connecting…</span></span>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <label class="switch" title="Free teams automatically pick up waiting tasks">
      <input type="checkbox" id="auto"> Auto-dispatch
    </label>
  </header>

  <form class="card new-task" id="new-task">
    <div class="fields">
      <label class="visually-hidden" for="t-title">Task title</label>
      <input type="text" id="t-title" placeholder="New task, e.g. Build the export feature" required autocomplete="off">
      <label class="visually-hidden" for="t-desc">Details</label>
      <textarea id="t-desc" rows="1" placeholder="Details (optional)"></textarea>
    </div>
    <div class="seg" role="radiogroup" aria-label="Task size">
      <label><input type="radio" name="size" value="small" checked><span>Small</span></label>
      <label><input type="radio" name="size" value="large"><span>Large</span></label>
    </div>
    <button class="primary" type="submit">Assign task</button>
    <p class="hint">Each task gets one team. A large task gets all three teams when nothing else is running. Tasks wait in the queue when every team is busy.</p>
  </form>

  <h2>Teams</h2>
  <div class="teams" id="teams"></div>

  <h2>Time by team</h2>
  <div class="time-grid" id="time"></div>

  <div class="task-groups">
    <section>
      <h2>Tasks</h2>
      <div class="tasks" id="tasks"></div>
      <details class="finished" id="finished-wrap"><summary id="finished-sum">Finished</summary><div class="tasks" id="finished"></div></details>
    </section>
    <section>
      <h2>Activity</h2>
      <div class="card log" id="log"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const OPEN = ['active', 'review', 'queued', 'paused'];
const STATUS_LABEL = { active: 'Active', review: 'In review', queued: 'Queued', paused: 'Paused', done: 'Done', cancelled: 'Cancelled' };
const isReviewer = (a) => a.role === 'reviewer';
const shortName = (team) => team.name.replace(/^Team\s+/i, '');
// Mirrors core.reviewStatus: verdicts of the teams currently on the task, current round only.
function reviewStatus(task) {
  const round = task.reviewRound || 0;
  const out = { round, approved: [], changes: [], pending: [] };
  for (const team of state.teams.filter((t) => t.taskId === task.id)) {
    const r = (task.reviews || {})[team.id];
    if (round && r && r.round === round && r.verdict === 'approved') out.approved.push(team.id);
    else if (round && r && r.round === round && r.verdict === 'changes') out.changes.push(team.id);
    else out.pending.push(team.id);
  }
  return out;
}
// Mirrors core.reviewGate: can the task be marked done without force?
// Teams on it: all must have approved the current round. No teams but worked by a team (teamHistory):
// its latest round must have been fully approved (approvedRound === reviewRound > 0).
function reviewGate(task) {
  const name = (id) => state.teams.find((t) => t.id === id)?.name || id;
  const onTask = state.teams.filter((t) => t.taskId === task.id);
  if (onTask.length) {
    const rs = reviewStatus(task);
    const missing = onTask.map((t) => t.id).filter((id) => !rs.approved.includes(id));
    return { ok: !missing.length, missing,
      message: missing.length ? `${task.id} needs reviewer sign-off from ${missing.map(name).join(', ')}. Send it to review, or mark it done with force.` : '' };
  }
  const worked = (task.teamHistory || []).length > 0;
  const round = task.reviewRound || 0;
  if (worked && !(round > 0 && task.approvedRound === round)) {
    return { ok: false, missing: [], message: `${task.id} was worked on but has no reviewer sign-off. Mark it done with force.` };
  }
  return { ok: true, missing: [], message: '' };
}
let state = null;

// ---- durations (mirrors core.mjs formatDuration; shared by task/team cards and "Time by team") ----
function fmtDuration(ms) {
  const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ${String(m % 60).padStart(2, '0')}m`;
  return `${Math.floor(h / 24)}d ${h % 24}h`;
}
// Closed base ms plus the open interval since `sinceIso` (null/'' = not running).
function liveMs(baseMs, sinceIso) {
  const base = Number(baseMs) || 0;
  if (!sinceIso) return base;
  const t = new Date(sinceIso).getTime();
  return Number.isFinite(t) ? base + Math.max(0, Date.now() - t) : base;
}
// A ticking duration label: the 1 s ticker rewrites the textContent of every [data-live-base] element.
const liveSpan = (baseMs, sinceIso, cls = '') =>
  `<span class="dur ${cls}" data-live-base="${Number(baseMs) || 0}" data-live-since="${esc(sinceIso || '')}">${fmtDuration(liveMs(baseMs, sinceIso))}</span>`;
function tickDurations() {
  for (const el of document.querySelectorAll('[data-live-base]')) {
    const txt = fmtDuration(liveMs(el.dataset.liveBase, el.dataset.liveSince));
    if (el.textContent !== txt) el.textContent = txt;
  }
}
setInterval(tickDurations, 1000);

async function api(method, path, body) {
  try {
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.result;
  } catch (err) {
    toast(err.message);
    throw err;
  }
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

const ago = (iso) => {
  if (!iso) return '';
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
};

function teamOptions(task) {
  return state.teams
    .filter((t) => t.taskId !== task.id)
    .map((t) => `<option value="${t.id}">${esc(t.name)}${t.taskId ? ` (on ${t.taskId})` : ' (free)'}</option>`)
    .join('');
}

function renderStats() {
  const active = state.tasks.filter((t) => t.status === 'active').length;
  const inReview = state.tasks.filter((t) => t.status === 'review').length;
  const waiting = state.tasks.filter((t) => t.status === 'queued' || t.status === 'paused').length;
  const busy = state.teams.filter((t) => t.taskId).length;
  const agents = state.teams.flatMap((t) => t.agents);
  const working = agents.filter((a) => a.status === 'working').length;
  const done = state.tasks.filter((t) => t.status === 'done').length;
  $('#stats').innerHTML = [
    [active, 'Active tasks'], [inReview, 'In review'], [waiting, 'Waiting'], [`${busy}/${state.teams.length}`, 'Teams busy'],
    [`${working}/${agents.length}`, 'Agents working'], [done, 'Done'],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#auto').checked = state.settings.autoDispatch;
}

function renderTeams() {
  const open = state.tasks.filter((t) => OPEN.includes(t.status));
  $('#teams').innerHTML = state.teams.map((team) => {
    const task = state.tasks.find((t) => t.id === team.taskId);
    const moveOpts = open.filter((t) => t.id !== team.taskId)
      .map((t) => `<option value="${t.id}">${esc(t.id)} · ${esc(t.title)}</option>`).join('');
    return `<article class="card team" style="--team:${team.color}">
      <div class="team-head">
        <div class="team-name">${esc(team.name)} <span class="pill ${task ? (task.status === 'review' ? 'review' : 'active') : ''}">${task ? (task.status === 'review' ? 'In review' : 'On task') : 'Free'}</span></div>
        <div class="team-task">${task ? `<strong>${esc(task.id)}</strong> ${esc(task.title)}` : 'Waiting for a task'}</div>
        <div class="team-time">${task ? `On this task ${liveSpan((task.teamMs || {})[team.id] || 0, team.assignedAt)} · ` : ''}Total ${liveSpan(team.totalMs || 0, task ? team.assignedAt : null)}</div>
        ${team.focus ? `<div class="focus">Focus: ${esc(team.focus)}</div>` : ''}
        ${task ? `<div class="prow"><div class="progress" role="progressbar" aria-valuenow="${team.progress}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(team.name)} progress"><i style="width:${team.progress}%"></i></div><b>${team.progress}%</b></div>` : ''}
      </div>
      <ul class="agents">
        ${[...team.agents.filter((a) => !isReviewer(a)), ...team.agents.filter(isReviewer)].map((a) => isReviewer(a)
          ? `<li class="reviewer" title="${esc(a.name || 'Reviewer')} · ${esc(a.status)}${a.updatedAt ? ' · ' + ago(a.updatedAt) : ''}">
          <span class="dot ${a.status}"></span><span class="agent-name">${esc(a.id)}</span>
          <span class="agent-work ${a.work ? '' : 'empty'}"><span class="tag">Reviewer</span><span>${esc(a.work || a.status)}</span></span></li>`
          : `<li title="${esc(a.status)}${a.updatedAt ? ' · ' + ago(a.updatedAt) : ''}">
          <span class="dot ${a.status}"></span><span class="agent-name">${esc(a.id)}</span>
          <span class="agent-work ${a.work ? '' : 'empty'}">${esc(a.work || a.status)}</span></li>`).join('')}
      </ul>
      <div class="team-actions">
        <select data-move="${team.id}" aria-label="Move ${esc(team.name)} to a task" ${moveOpts ? '' : 'disabled'}>
          <option value="">${moveOpts ? (task ? 'Reassign to…' : 'Assign to…') : 'No other open tasks'}</option>${moveOpts}
        </select>
        ${task ? `<button class="danger" data-unassign="${task.id}" data-team="${team.id}">Remove from task</button>` : ''}
      </div>
    </article>`;
  }).join('');
}

// Timer line + per-team breakdown for a task card. Open intervals tick via data-live-*.
function taskTimer(task, finished) {
  const activeMs = task.activeMs || 0;
  const since = task.status === 'active' || task.status === 'review' ? task.activeSince : null;
  const teamMs = task.teamMs || {};
  const byId = Object.fromEntries(state.teams.map((t) => [t.id, t]));
  const ids = [...new Set([...Object.keys(teamMs), ...state.teams.filter((t) => t.taskId === task.id).map((t) => t.id)])];
  const parts = ids.map((id) => {
    const team = byId[id];
    const open = team && team.taskId === task.id ? team.assignedAt : null;
    const base = teamMs[id] || 0;
    if (base < 1000 && !open) return null;
    const label = team ? team.name.replace(/^Team\s+/i, '') : id;
    return { order: team ? state.teams.indexOf(team) : 99, html: `<span class="tt-team" style="--team:${team ? team.color : 'var(--muted)'}">${esc(label)} ${liveSpan(base, open)}</span>` };
  }).filter(Boolean).sort((a, b) => a.order - b.order).map((p) => p.html);
  let line;
  if (finished) {
    const wall = task.finishedAt && task.createdAt ? new Date(task.finishedAt) - new Date(task.createdAt) : 0;
    line = `Took ${liveSpan(activeMs, null)} active${wall > 0 ? ` · ${liveSpan(wall, null)} start to finish` : ''}`;
  } else if (activeMs || since) {
    line = `<span aria-hidden="true">⏱</span> ${liveSpan(activeMs, since)} active`;
  } else {
    line = '<span aria-hidden="true">⏱</span> Not started';
  }
  return `<div class="task-timer${since ? ' running' : ''}"><span class="tt-main">${line}</span>${parts.length ? `<span class="tt-teams">${parts.join('<span class="tt-sep"> · </span>')}</span>` : ''}</div>`;
}

// Review line: "Round N", one verdict chip per team (✓ Approved · ✗ Changes requested · ⋯ Waiting), approve/request
// buttons for teams still waiting while the task is in review, and "N issues caught".
function reviewRow(task, teams) {
  const round = task.reviewRound || 0;
  const issues = Number(task.issuesFound) || 0;
  if (!round && !issues) return '';
  const byId = Object.fromEntries(state.teams.map((t) => [t.id, t]));
  const reviews = task.reviews || {};
  const inReview = task.status === 'review';
  // In review: every team on the task (waiting ones included). Otherwise: whatever was recorded in the latest round.
  const ids = inReview ? teams.map((t) => t.id)
    : Object.keys(reviews).filter((id) => reviews[id] && reviews[id].round === round)
      .sort((a, b) => state.teams.indexOf(byId[a]) - state.teams.indexOf(byId[b]));
  const chips = ids.map((id) => {
    const team = byId[id];
    const name = team ? shortName(team) : id;
    const r = reviews[id] && reviews[id].round === round ? reviews[id] : null;
    const kind = r ? r.verdict : 'waiting';
    const label = kind === 'approved' ? '<span aria-hidden="true">✓</span> Approved'
      : kind === 'changes' ? '<span aria-hidden="true">✗</span> Changes requested' : '<span aria-hidden="true">⋯</span> Waiting';
    const tip = r ? [`${name} reviewer, round ${r.round}: ${kind === 'approved' ? 'approved' : 'changes requested'}`,
      r.note ? `Note: ${r.note}` : '', r.issues ? `${r.issues} issue${r.issues === 1 ? '' : 's'} found` : '',
      r.at ? new Date(r.at).toLocaleString() : ''].filter(Boolean).join('\n')
      : `${name} reviewer has not signed off on round ${round} yet`;
    const chip = `<span class="verdict ${kind}" style="--team:${team ? team.color : 'var(--muted)'}" title="${esc(tip)}"><b>${esc(name)}</b> ${label}${
      r && r.verdict === 'changes' && r.note ? ` <span class="vnote">${esc(r.note)}</span>` : ''}</span>`;
    const canAct = inReview && team && team.taskId === task.id;
    // No verdict yet: Approve / Request changes. Verdict given this round: a small "Change" flips it.
    const flip = kind === 'approved' ? 'changes' : 'approved';
    const actions = !canAct ? '' : kind === 'waiting'
      ? `<span class="verdict-actions"><button class="small ok" data-verdict="approved" data-task="${task.id}" data-team="${id}" aria-label="Approve ${esc(task.id)} for ${esc(team.name)}">Approve</button><button class="small danger" data-verdict="changes" data-task="${task.id}" data-team="${id}" aria-label="Request changes on ${esc(task.id)} for ${esc(team.name)}">Request changes</button></span>`
      : `<button class="small link" data-verdict="${flip}" data-task="${task.id}" data-team="${id}" title="Change ${esc(name)}'s verdict to ${flip === 'approved' ? 'approved' : 'changes requested'}" aria-label="Change ${esc(team.name)}'s verdict on ${esc(task.id)} to ${flip === 'approved' ? 'approved' : 'changes requested'}">Change</button>`;
    return chip + actions;
  });
  return `<div class="review-row">${round ? `<span class="round">Review round ${round}</span>` : ''}${chips.join('')}${
    issues ? `<span class="issues">${issues} issue${issues === 1 ? '' : 's'} caught</span>` : ''}</div>`;
}

function taskCard(task) {
  const teams = state.teams.filter((t) => t.taskId === task.id);
  const finished = !OPEN.includes(task.status);
  const opts = finished ? '' : teamOptions(task);
  return `<article class="card task ${finished ? 'finished' : ''}">
    <div class="task-top">
      <span class="task-id">${esc(task.id)}</span>
      <span class="task-title">${esc(task.title)}</span>
      ${task.size === 'large' ? '<span class="pill large">Large</span>' : ''}
      <span class="pill ${esc(task.status)}">${esc(STATUS_LABEL[task.status] || task.status)}</span>
    </div>
    ${task.description ? `<p class="task-desc">${esc(task.description)}</p>` : ''}
    <div class="prow"><div class="progress" role="progressbar" aria-valuenow="${task.progress}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(task.id)} progress"><i style="width:${task.progress}%"></i></div><b>${task.progress}%</b></div>
    ${taskTimer(task, finished)}
    ${reviewRow(task, teams)}
    ${finished ? '' : `<div class="chips">
      ${teams.length ? teams.map((t) => `<span class="chip" style="--team:${t.color}"><i></i>${esc(t.name)} <small>${t.progress}%</small>
        <button title="Remove ${esc(t.name)} from ${esc(task.id)}" aria-label="Remove ${esc(t.name)} from ${esc(task.id)}" data-unassign="${task.id}" data-team="${t.id}">×</button></span>`).join('')
        : `<span class="none">${task.status === 'paused' ? 'Paused, no team assigned' : 'Waiting for a free team'}</span>`}
    </div>`}
    <div class="task-actions">
      ${opts ? `<select data-assign="${task.id}" aria-label="Add a team to ${esc(task.id)}"><option value="">+ Add team…</option>${opts}</select>` : ''}
      ${task.status === 'paused' ? `<button class="small" data-status="queued" data-task="${task.id}">Queue</button>` : ''}
      ${task.status === 'active' && teams.length ? `<button class="small review" data-send-review="${task.id}">Send to review</button>` : ''}
      ${task.status === 'active' || task.status === 'review' || task.status === 'queued' ? `<button class="small" data-status="paused" data-task="${task.id}">Pause</button>` : ''}
      ${finished ? `<button class="small" data-status="queued" data-task="${task.id}">Reopen</button>`
        : `<button class="small" data-done="${task.id}">Mark done</button>
           <button class="small" data-status="cancelled" data-task="${task.id}">Cancel</button>`}
      <button class="small danger" data-delete="${task.id}">Delete</button>
      <span class="none" style="margin-left:auto">updated ${ago(task.updatedAt)}</span>
    </div>
  </article>`;
}

function renderTasks() {
  const order = { active: 0, review: 1, queued: 2, paused: 3 };
  const open = state.tasks.filter((t) => OPEN.includes(t.status))
    .sort((a, b) => order[a.status] - order[b.status] || a.createdAt.localeCompare(b.createdAt));
  const finished = state.tasks.filter((t) => !OPEN.includes(t.status))
    .sort((a, b) => (b.finishedAt || '').localeCompare(a.finishedAt || ''));
  $('#tasks').innerHTML = open.length ? open.map(taskCard).join('')
    : '<div class="empty-state">No open tasks. Add one above and a team picks it up.</div>';
  $('#finished-wrap').hidden = !finished.length;
  $('#finished-sum').textContent = `Finished (${finished.length})`;
  $('#finished').innerHTML = finished.map(taskCard).join('');
}

// "Time by team": per-team totals computed from state (closed ms + the open interval since assignedAt).
function renderTime() {
  const rows = state.teams.map((team) => {
    const task = state.tasks.find((t) => t.id === team.taskId);
    const done = state.tasks.filter((t) => t.status === 'done' && (t.teamMs?.[team.id] || 0) > 0);
    const avg = done.length ? done.reduce((sum, t) => sum + t.teamMs[team.id], 0) / done.length : 0;
    return { team, task, total: liveMs(team.totalMs, team.assignedAt), done: done.length, avg, issues: Number(team.issuesFound) || 0 };
  });
  const max = Math.max(0, ...rows.map((r) => r.total));
  $('#time').innerHTML = rows.map(({ team, task, total, done, avg, issues }) => {
    const pct = max ? Math.max(2, Math.round((total / max) * 100)) : 0;
    // Compare whole seconds (what the cards show): sub-second live totals read "0s" and must not win the badge.
    const top = Math.floor(max / 1000) > 0 && Math.floor(total / 1000) === Math.floor(max / 1000);
    return `<article class="card time-card ${top ? 'top' : ''}" style="--team:${team.color}">
      <div class="time-head"><span class="time-name">${esc(team.name)}</span>${top ? '<span class="pill time-top">Most time</span>' : ''}</div>
      <div class="time-total">${liveSpan(team.totalMs, team.assignedAt)}<small>total</small></div>
      <div class="progress time-bar" role="img" aria-label="${esc(team.name)}: ${pct}% of the most time spent by a team"><i style="width:${pct}%"></i></div>
      <dl class="time-facts">
        <div><dt>Tasks done</dt><dd>${done}</dd></div>
        <div><dt>Avg per done task</dt><dd>${done ? fmtDuration(avg) : '—'}</dd></div>
        <div><dt>Issues caught</dt><dd>${issues}</dd></div>
      </dl>
      <div class="time-now">${task
        ? `<span>Now:</span> <strong>${esc(task.id)}</strong> <span class="time-task" title="${esc(task.title)}">${esc(task.title)}</span> ${liveSpan(task.teamMs?.[team.id] || 0, team.assignedAt)}`
        : '<span class="none">Free, not on a task</span>'}</div>
    </article>`;
  }).join('');
}
// The ticker keeps the numbers live; this keeps the bars and the "Most time" badge in step (no inputs inside, safe to redraw).
setInterval(() => state && renderTime(), 5000);

function renderLog() {
  const teamName = Object.fromEntries(state.teams.map((t) => [t.id, t]));
  const items = state.log.slice(-80).reverse();
  $('#log').innerHTML = items.length ? items.map((e) => {
    const team = e.teamId && teamName[e.teamId];
    const who = e.agentId || (e.kind === 'progress' && team ? team.name : '');
    return `<div class="log-item"><time datetime="${e.at}" title="${new Date(e.at).toLocaleString()}">${ago(e.at)}${e.taskId ? ` · ${esc(e.taskId)}` : ''}</time>
      ${who ? `<span class="who"${team ? ` style="--team:${team.color}"` : ''}>${esc(who)}:</span> ` : ''}${esc(e.message)}</div>`;
  }).join('') : '<div class="log-item none">Nothing yet.</div>';
}

let pending = false;
function render() {
  if (!state) return;
  const active = document.activeElement;
  // Don't yank an open dropdown out from under the user; render once they leave it.
  if (active && active.tagName === 'SELECT' && active.closest('#teams, #tasks') && !active.value) {
    pending = true;
    return;
  }
  pending = false;
  renderStats(); renderTeams(); renderTime(); renderTasks(); renderLog();
}
document.addEventListener('focusout', () => setTimeout(() => pending && render(), 0));

// ---- events ----
$('#new-task').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = $('#t-title').value.trim();
  if (!title) return;
  const size = document.querySelector('input[name=size]:checked').value;
  const r = await api('POST', '/api/tasks', { title, description: $('#t-desc').value, size });
  $('#t-title').value = ''; $('#t-desc').value = '';
  toast(r.assigned.length ? `${r.task.id} assigned to ${r.assigned.map((id) => state.teams.find((t) => t.id === id)?.name || id).join(', ')}` : `${r.task.id} queued until a team is free`);
});

$('#auto').addEventListener('change', (e) => api('PATCH', '/api/settings', { autoDispatch: e.target.checked }));

document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.move && el.value) {
    const r = await api('POST', `/api/tasks/${el.value}/assign`, { teamId: el.dataset.move });
    toast(`${r.team.name} → ${r.task.id}${r.previous ? ` (from ${r.previous})` : ''}`);
  } else if (el.dataset.assign && el.value) {
    const r = await api('POST', `/api/tasks/${el.dataset.assign}/assign`, { teamId: el.value });
    toast(`${r.team.name} → ${r.task.id}${r.previous ? ` (from ${r.previous})` : ''}`);
  }
});

document.addEventListener('click', async (e) => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.unassign) {
    const r = await api('POST', `/api/tasks/${el.dataset.unassign}/unassign`, { teamId: el.dataset.team });
    toast(`${r.team.name} removed from ${r.task.id}`);
  } else if (el.dataset.sendReview) {
    const t = await api('PATCH', `/api/tasks/${el.dataset.sendReview}`, { status: 'review' });
    toast(`${t.id} sent to review (round ${t.reviewRound || 1})`);
  } else if (el.dataset.verdict) {
    const { task: taskId, team: teamId, verdict } = el.dataset;
    const teamName = state.teams.find((t) => t.id === teamId)?.name || teamId;
    let note = '';
    let issues = 0;
    if (verdict === 'changes') {
      const n = prompt(`What should ${teamName} change on ${taskId}?`);
      if (n === null) return;
      note = n.trim();
      const count = prompt('How many issues did the review find?', '1');
      if (count === null) return;
      issues = Math.max(0, Math.floor(Number(count)) || 0);
    }
    const r = await api('POST', '/api/op', { type: 'reviewTask', args: { taskId, teamId, verdict, note, issues, by: 'user' } });
    // Based on the reviewTask result: the task leaves review only once every team on it has a verdict.
    const names = (ids) => (ids || []).map((id) => state.teams.find((t) => t.id === id)?.name || id).join(', ');
    const waiting = r && r.pending && r.pending.length ? ` — waiting for ${names(r.pending)}` : '';
    toast(r && r.approved ? `${taskId} approved by every reviewer, ready to mark done`
      : r && r.complete ? `${taskId} back to the builders: changes requested by ${names(r.changes)}`
      : `${verdict === 'changes' ? `Changes requested by ${teamName}` : `${teamName} approved ${taskId}`}${waiting}`);
  } else if (el.dataset.done) {
    const task = state.tasks.find((t) => t.id === el.dataset.done);
    const gate = task ? reviewGate(task) : { ok: true };
    if (!gate.ok) {
      if (!confirm(`Mark done without reviewer sign-off?\n${gate.message}`)) return;
      await api('PATCH', `/api/tasks/${el.dataset.done}`, { status: 'done', force: true });
      return;
    }
    try {
      await api('PATCH', `/api/tasks/${el.dataset.done}`, { status: 'done' });
    } catch (err) {
      // The server knows best (e.g. a team joined since our last update); api() already showed its reason in the toast.
      if (/sign-off|review/i.test(err.message) && confirm(`${err.message}\n\nMark done without reviewer sign-off?`)) {
        await api('PATCH', `/api/tasks/${el.dataset.done}`, { status: 'done', force: true });
      }
    }
  } else if (el.dataset.status) {
    await api('PATCH', `/api/tasks/${el.dataset.task}`, { status: el.dataset.status });
  } else if (el.dataset.delete) {
    if (confirm(`Delete ${el.dataset.delete}? Its teams are freed.`)) await api('DELETE', `/api/tasks/${el.dataset.delete}`);
  }
});

// ---- live updates ----
// on = SSE connection is up; sync = the server's {mode, ok, lastSync, error, url}
function setLive(on, sync) {
  const el = $('#live');
  const hub = on && sync && sync.mode === 'hub';
  const offline = hub && !sync.ok;
  let text = 'Reconnecting…';
  let tip = 'Lost the connection to the dashboard server. Retrying…';
  if (offline) {
    text = 'Shared board offline · showing last copy';
    tip = (sync.error || `Can't reach the shared board${sync.url ? ' at ' + sync.url : ''}`)
      + (sync.lastSync ? `\nLast synced ${new Date(sync.lastSync).toLocaleString()}` : '')
      + '\nChanges are paused until it is back.';
  } else if (hub) {
    text = 'Live · Shared board';
    tip = `Synced with the shared board${sync.url ? ' at ' + sync.url : ''}`;
  } else if (on) {
    text = 'Live · This PC only';
    tip = 'Tasks are saved on this PC only. See "Shared board" in department/README.md to share them.';
  }
  el.classList.toggle('on', on && !offline);
  el.classList.toggle('warn', !!offline);
  el.title = tip;
  $('#live span').textContent = text;
}
function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => { state = JSON.parse(e.data); setLive(true, state.sync); render(); });
  es.onerror = () => setLive(false);
}
connect();
setInterval(render, 30000); // refresh "x ago" labels
</script>
</body>
