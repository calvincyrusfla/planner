<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Agent Department</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12366b"/>
      <stop offset="1" stop-color="#0b1d3a"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f7"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- edges: ring links (softer) -->
  <g fill="none" stroke="#8fb4e8" stroke-width="36" stroke-linecap="round">
    <line x1="512" y1="214" x2="770" y2="363"/>
    <line x1="770" y1="661" x2="512" y2="810"/>
    <line x1="254" y1="661" x2="254" y2="363"/>
  </g>

  <!-- edges: hub spokes (bright) -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="214"/>
    <line x1="512" y1="512" x2="770" y2="363"/>
    <line x1="512" y1="512" x2="770" y2="661"/>
    <line x1="512" y1="512" x2="512" y2="810"/>
    <line x1="512" y1="512" x2="254" y2="661"/>
    <line x1="512" y1="512" x2="254" y2="363"/>
  </g>

  <!-- outer nodes, tinted by team: alpha, bravo, charlie -->
  <g stroke="#ffffff" stroke-width="20">
    <circle cx="512" cy="214" r="84" fill="#e8590c"/>
    <circle cx="770" cy="363" r="84" fill="#1c7ed6"/>
    <circle cx="770" cy="661" r="84" fill="#2f9e44"/>
    <circle cx="512" cy="810" r="84" fill="#e8590c"/>
    <circle cx="254" cy="661" r="84" fill="#1c7ed6"/>
    <circle cx="254" cy="363" r="84" fill="#2f9e44"/>
  </g>

  <!-- central hub -->
  <circle cx="512" cy="512" r="118" fill="url(#hub)"/>
  <circle cx="512" cy="512" r="52" fill="#12366b"/>
</svg>
